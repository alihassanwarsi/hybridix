[project]
name = "hybridix"
version = "0.1.0"
description = "A modular RAG engine focused on hybrid retrieval, grounded answer generation, citation verification, and evaluation."
readme = "README.md"
authors = [
    { name = "alihassanwarsi", email = "contact.alix27@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.12",
    "chromadb>=1.5.9",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.1.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"